name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Force compileSdk 36 on every module (plugins included)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/compile-sdk.gradle" <<'GRADLE'
          allprojects { p ->
            p.afterEvaluate {
              def ext = p.extensions.findByName('android')
              if (ext != null) {
                try { ext.compileSdk = 36 } catch (Throwable t) { ext.compileSdkVersion(36) }
              }
            }
          }
          GRADLE
      - name: Build
        run: |
          [ -d android ] || flutter create --platforms=android --project-name fittrack --org com.fittrack .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="FitTrack"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fittrack-v1.3.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
