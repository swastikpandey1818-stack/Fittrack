name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        run: |
          [ -d android ] || flutter create --platforms=android --project-name fittrack --org com.fittrack .
          sed -i "s/compileSdkVersion 34/compileSdkVersion 36/g; s/compileSdk = 34/compileSdk = 36/g" android/app/build.gradle*
          sed -i "s/compileSdk = 34/compileSdk = 36/g" android/app/build.gradle.kts
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="FitTrack"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fittrack-v1.3.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
