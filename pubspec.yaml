name: fittrack
description: FitTrack - pro workout tracker
publish_to: 'none'
version: 1.4.0+7
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  file_picker: ^8.1.2
  google_mobile_ads: ^9.2.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#040706"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
